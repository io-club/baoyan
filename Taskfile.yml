version: '3'

tasks:
  up:
    desc: Build and start or update the local application
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/start-local.ps1"
  deploy:
    desc: Deploy locally using the same startup entry point
    cmds:
      - task: up
  test:
    desc: Build, test and start the local application
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/start-local.ps1" -Test
  stop:
    desc: Stop this Compose project without deleting its data
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/stop-local.ps1"
  check:
    desc: Check PowerShell syntax and local Compose configuration
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/deploy/check-source.ps1"
  status:
    desc: Show local service status
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/deploy/local-compose.ps1" ps
  logs:
    desc: Show recent local service logs
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/deploy/local-compose.ps1" logs
