# Both vendor UIs use /api. Route their native calls without changing their
# client bundles; business paths below always go through Spring Cloud.
map $http_referer $default_ui_api {
    default http://openhands:8000;
    ~*/webui/ http://napcat:6099;
}
map $uri $ui_api {
    default $default_ui_api;
    ~^/api/(auth|base|QQLogin|OB11Config)/ http://napcat:6099;
}
server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;
    location ~ ^/(workspace\.js|ui-shell\.js|console\.css|calendar\.css|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /api/conversations {
        error_page 418 = @platform_agent_launch;
        if ($request_method = POST) { return 418; }
        set $agent http://openhands:8000;
        proxy_pass $agent;
        proxy_set_header Host $http_host;
    }
    location @platform_agent_launch {
        set $platform http://platform-api:8080;
        rewrite ^ /internal/agent/conversations break;
        proxy_pass $platform;
        proxy_read_timeout 150s;
    }
    location = /healthz { proxy_pass http://gateway:8080/actuator/health; }
    location = /api/platform { return 308 /api/platform/; }
    location /api/platform/ { proxy_pass http://gateway:8080; }
    location = /api/tasks { proxy_pass http://gateway:8080; }
    location /api/tasks/ { proxy_pass http://gateway:8080; }
    location /api/xhs/ { proxy_pass http://gateway:8080; }
    location /nacos/ { proxy_pass http://nacos:8848/nacos/; }
    location /agent/ {
        set $agent http://openhands:8000;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
    location /canvas {
        set $agent http://openhands:8000;
        proxy_pass $agent;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { set $agent http://openhands:8000; proxy_pass $agent; }
    location ~ ^/(alive|health|ready|server_info|openapi\.json)$ {
        set $agent http://openhands:8000;
        proxy_pass $agent;
        proxy_set_header Host $http_host;
    }
    location /ws/ {
        set $agent http://openhands:8000;
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/ {
        proxy_pass $ui_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
    location /napcat/ {
        set $napcat http://napcat:6099;
        rewrite ^/napcat/(.*)$ /$1 break;
        proxy_pass $napcat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /webui {
        set $napcat http://napcat:6099;
        proxy_pass $napcat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { try_files $uri /index.html; }
}
