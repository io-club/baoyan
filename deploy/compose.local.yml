name: baoyan-local
networks:
  default:
    name: baoyan-local-appnet
  agentnet:
    name: baoyan-local-agentnet
services:
  minio:
    image: ${BAOYAN_MINIO_IMAGE:-docker.m.daocloud.io/pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
  task-api:
    environment:
      BAOYAN_AGENT_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY}
    build:
      args:
        PYTHON_IMAGE: ${BAOYAN_PYTHON_IMAGE:-docker.1ms.run/library/python:3.11-slim@sha256:db20d8506e2f15b6db39b40b6015ca46bae855dec6dd326d462cfe79ae972893}
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
  platform-api:
    environment:
      NAPCAT_WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN}
      OPENHANDS_STATUS_URL: http://local-web/agent/
      OPENHANDS_CONTROL_URL: http://local-web/agent
      OPENHANDS_LOCAL_BACKEND_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY}
      BAOYAN_AGENT_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY}
    build:
      args:
        PYTHON_IMAGE: ${BAOYAN_PYTHON_IMAGE:-docker.1ms.run/library/python:3.11-slim@sha256:db20d8506e2f15b6db39b40b6015ca46bae855dec6dd326d462cfe79ae972893}
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        ALL_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        all_proxy: ""
  local-web:
    image: ${BAOYAN_NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "127.0.0.1:18081:80"
    networks:
      - default
      - agentnet
    volumes:
      - ../services/web/public:/usr/share/nginx/html:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      task-api:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    build:
      args:
        JRE_IMAGE: ${BAOYAN_JRE_IMAGE:-eclipse-temurin:17-jre-alpine}
  xhs:
    build:
      args:
        PYTHON_IMAGE: ${BAOYAN_PYTHON_IMAGE:-docker.1ms.run/library/python:3.11-slim@sha256:db20d8506e2f15b6db39b40b6015ca46bae855dec6dd326d462cfe79ae972893}
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
        ALL_PROXY: ''
        http_proxy: ''
        https_proxy: ''
        all_proxy: ''
  openhands:
    image: ${BAOYAN_OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas:1.34.0}
    environment:
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: 'true'
      BAOYAN_AGENT_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY}
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    profiles: [integrations]
  napcat:
    image: ${BAOYAN_NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.42}
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    profiles: [integrations]
  reminder-worker:
    image: baoyan-tasks:local
    pull_policy: never
    command: ["python", "-m", "app.reminders"]
    environment:
      PLATFORM_API_URL: http://platform-api:8080
      TASK_ADMIN_PASSWORD: ${BAOYAN_ADMIN_PASSWORD}
      NACOS_URL: http://nacos:8848/nacos
    depends_on:
      platform-api:
        condition: service_healthy
    restart: unless-stopped
